[tools]
aws = { version = "latest", symlink_bins = "true" }
go = "1.27.3"
"go:github.com/pressly/goose/v3/cmd/goose" = "latest"
pulumi = "latest"

[env]
AWS_PROFILE = "medic"
PULUMI_STATE_BUCKET = "moroz-dev-comments-pulumi-state-eu-central-1"
PULUMI_BACKEND_URL = "s3://{{ env.PULUMI_STATE_BUCKET }}/state?region=eu-central-1"
DATABASE_URL = "file:dev.db"
GOOSE_DRIVER = "turso"
GOOSE_MIGRATION_DIR = "db/migrations"
GOOSE_DBSTRING = "{{ env.DATABASE_URL }}"

PULUMI_CONFIG_PASSPHRASE = { age = "" }
PRODUCTION_DATABASE_URL = { age = "" }
PRODUCTION_DATABASE_TOKEN = { age = { value = "", format = "zstd" } }

